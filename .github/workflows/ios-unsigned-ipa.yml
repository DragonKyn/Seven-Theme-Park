name: Build unsigned IPA

# Produces a code-signing-free .ipa for sideloading (Sideloadly, AltStore, etc.).
# Sideloadly re-signs the app with your own Apple ID when it installs it, so the
# build here deliberately skips signing entirely.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ParkEmpire.xcodeproj \
            -scheme ParkEmpire \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Package into an IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ParkEmpire.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; exit 1; }
          rm -rf Payload ParkEmpire.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ParkEmpire.ipa Payload
          ls -lh ParkEmpire.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ParkEmpire-unsigned-ipa
          path: ParkEmpire.ipa
          if-no-files-found: error
          retention-days: 30
