name: Build unsigned IPA

# Produces a code-signing-free .ipa for sideloading (Sideloadly, AltStore, etc.).
# Sideloadly re-signs the app with your own Apple ID when it installs it, so the
# build here deliberately skips signing entirely.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Build for device (unsigned)
        id: build
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project ParkEmpire.xcodeproj \
            -scheme ParkEmpire \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee xcodebuild.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit "${PIPESTATUS[0]}"

      # Actions logs need a signed-in session even on a public repo, but the run
      # summary page is readable by anyone. Mirroring the diagnostics there is
      # what makes a failed build debuggable from outside GitHub.
      - name: Publish diagnostics to the run summary
        if: always()
        run: |
          set -uo pipefail
          log=xcodebuild.log
          {
            echo "## Build diagnostics"
            echo
            echo "Build step exit code: \`${{ steps.build.outputs.exit_code || 'unknown' }}\`"
            echo
            if [ ! -f "$log" ]; then
              echo "No \`xcodebuild.log\` was produced."
              exit 0
            fi
            echo "Log lines: \`$(wc -l < "$log" | tr -d ' ')\`"
            echo
            echo "### Errors"
            echo
            echo '```'
            grep -nE "(error:|fatal error:|\*\* BUILD FAILED|Command .* failed|The following build commands failed)" "$log" \
              | head -300 || echo "(no lines matched the error pattern)"
            echo '```'
            echo
            echo "### Warnings (first 60)"
            echo
            echo '```'
            grep -nE "warning:" "$log" | head -60 || echo "(none)"
            echo '```'
            echo
            echo "### Last 120 log lines"
            echo
            echo '```'
            tail -120 "$log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

      - name: Package into an IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ParkEmpire.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; exit 1; }
          rm -rf Payload ParkEmpire.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ParkEmpire.ipa Payload
          ls -lh ParkEmpire.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ParkEmpire-unsigned-ipa
          path: ParkEmpire.ipa
          if-no-files-found: error
          retention-days: 30
