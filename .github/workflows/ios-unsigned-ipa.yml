name: Build unsigned IPA

# Produces a code-signing-free .ipa for sideloading (Sideloadly, AltStore, etc.).
# Sideloadly re-signs the app with your own Apple ID when it installs it, so the
# build here deliberately skips signing entirely.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$latest" ]; then
            sudo xcode-select -s "$latest"
          fi
          xcodebuild -version
          swift --version

      - name: Build for device (unsigned)
        id: build
        run: |
          set -o pipefail
          set +e
          xcodebuild \
            -project ParkEmpire.xcodeproj \
            -scheme ParkEmpire \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build 2>&1 | tee xcodebuild.log
          # PIPESTATUS is rewritten by the next command, so snapshot it first.
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Describe what the build produced
        if: always()
        run: |
          set +e
          products=build/Build/Products/Release-iphoneos
          {
            echo "=== exit code: ${{ steps.build.outputs.exit_code || 'unknown' }}"
            echo "=== products tree"
            ls -lR "$products" 2>&1 | head -80
            echo "=== app binary"
            file "$products/ParkEmpire.app/ParkEmpire" 2>&1
            ls -l "$products/ParkEmpire.app/ParkEmpire" 2>&1
            echo "=== swift sources xcodebuild saw"
            grep -cE "SwiftCompile|CompileSwiftSources" xcodebuild.log 2>&1
            echo "=== errors"
            grep -nE "(error:|\*\* BUILD FAILED|The following build commands failed)" xcodebuild.log 2>&1 | head -200
          } > build-report.txt 2>&1
          cat build-report.txt

      # Actions logs and job summaries both need a signed-in session, even on a
      # public repository. Committing the log to a branch makes it readable
      # through raw.githubusercontent.com instead.
      - name: Publish log to the ci-logs branch
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/logs && cp xcodebuild.log build-report.txt /tmp/logs/ 2>/dev/null || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/logs/* . 2>/dev/null || true
          echo "run ${{ github.run_number }} · commit ${{ github.sha }} · $(date -u)" > README.md
          git add -A
          git commit -m "CI log for run ${{ github.run_number }}" --allow-empty
          git push -f origin ci-logs

      - name: Package into an IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/ParkEmpire.app"
          test -d "$APP_PATH" || { echo "App bundle not found at $APP_PATH"; exit 1; }
          test -f "$APP_PATH/ParkEmpire" || { echo "No executable inside the app bundle"; exit 1; }
          rm -rf Payload ParkEmpire.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry ParkEmpire.ipa Payload
          ls -lh ParkEmpire.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ParkEmpire-unsigned-ipa
          path: ParkEmpire.ipa
          if-no-files-found: error
          retention-days: 30
