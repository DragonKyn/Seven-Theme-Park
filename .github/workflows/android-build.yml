name: Build Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml', '.github/scripts/ci_report.py']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android
    env:
      # Optional. Without them the release is built unsigned and the advert identifiers are Google's test ones,
      # which is right for checking that it builds and wrong for the store. See android/RELEASE.md.
      RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Core tests
        run: |
          set -o pipefail
          gradle :core:test --stacktrace -i 2>&1 | tee ../core-test.log

      - name: Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../app-build.log

      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; the release will be unsigned."
          fi

      - name: Release bundle and APK
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: |
          set -o pipefail
          ARGS="-PVERSION_CODE=${{ github.run_number }}"
          [ -n "$ADMOB_APP_ID" ] && ARGS="$ARGS -PADMOB_APP_ID=$ADMOB_APP_ID"
          [ -n "$ADMOB_REWARDED_UNIT_ID" ] && ARGS="$ARGS -PADMOB_REWARDED_UNIT_ID=$ADMOB_REWARDED_UNIT_ID"
          gradle :app:assembleRelease :app:bundleRelease $ARGS --stacktrace 2>&1 | tee ../release-build.log

      - name: Report
        if: always()
        run: python3 ../.github/scripts/ci_report.py .. || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonderlot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonderlot-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
