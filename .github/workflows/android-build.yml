name: Build Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-build.yml', '.github/scripts/ci_report.py']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Core tests
        run: |
          set -o pipefail
          gradle :core:test --stacktrace -i 2>&1 | tee ../core-test.log

      - name: Debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee ../app-build.log

      - name: Report
        if: always()
        run: python3 ../.github/scripts/ci_report.py .. || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wonderlot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
